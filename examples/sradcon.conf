# Sradcon Configuration File
# This is an example configuration file demonstrating all available options

# ==============================================================================
# Resampling Settings
# ==============================================================================

# Target sample rate in Hz (1-384000)
# Common values: 44100, 48000, 88200, 96000, 176400, 192000
target_sr=44100

# Processing chunk size (128-65536)
# Larger values = better quality but more memory usage
# Recommended: 8192 for balanced quality/speed, 16384 for maximum quality
chunk_size=8192

# Number of FIR filter taps (3-65535, must be odd)
# More taps = sharper filtering but slower processing
# Recommended: 16383 for fast, 32767 for balanced, 65535 for maximum quality
filter_taps=32767

# Number of frequency bands for psychoacoustic analysis (4-512)
# More bands = finer frequency resolution
# Recommended: 128 (mel-scale bands)
num_bands=128

# Disable high-frequency enhancement during upsampling (true/false)
# HFE synthesizes high-frequency content when upsampling
# Set to true if you want pure resampling without enhancement
disable_hfe=false

# ==============================================================================
# Dithering and Requantization Settings
# ==============================================================================

# Target bit depth (8, 16, 24, 32, or 64)
# 8, 16, 24, 32 = PCM integer
# 64 = double-precision float (dithering skipped)
target_bit_depth=16

# LPC filter order for noise shaping (1-128)
# Higher order = more sophisticated noise shaping
# Recommended: 16 for balanced, 32 for maximum quality
lpc_order=16

# Enable dithering and noise shaping (true/false)
# Always recommended when reducing bit depth
enable_dither=true

# Force 32-bit float output (true/false)
# If true, ignores target_bit_depth and outputs float32
# Dithering is automatically disabled for float output
float32_output=false

# ==============================================================================
# Processing Settings
# ==============================================================================

# Enable Mid/Side processing for stereo files (true/false)
# Recommended: true for most stereo content
# May improve quality by processing mid and side channels separately
enable_ms_processing=true

# Enable debug mode (true/false)
# Saves intermediate processing data for analysis
# WARNING: Creates large CSV files, use only for debugging
enable_debug=false

# Debug output directory
# Used when enable_debug=true
debug_path=debug_plots

# Number of processing threads (0=auto-detect)
# 0 = use all available CPU cores
# 1 = single-threaded (slowest but lowest memory usage)
# N = use N threads
num_threads=0

# ==============================================================================
# Quality Presets
# ==============================================================================

# Uncomment one of the preset configurations below:

# --- Maximum Quality Preset ---
# chunk_size=16384
# filter_taps=65535
# lpc_order=32
# num_bands=256

# --- Balanced Quality/Speed Preset (Default) ---
# chunk_size=8192
# filter_taps=32767
# lpc_order=16
# num_bands=128

# --- Fast Processing Preset ---
# chunk_size=4096
# filter_taps=8191
# lpc_order=8
# num_bands=64

# ==============================================================================
# Notes
# ==============================================================================

# - Lines starting with '#' or ';' are comments
# - Format: key=value (no spaces around '=')
# - Boolean values: true/false, 1/0, yes/no, on/off
# - Unknown keys are silently ignored for forward compatibility
# - Command-line arguments override config file settings
# - Use '--debug' command-line flag to enable debug output
